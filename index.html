<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
  <title>Family Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><span class="mark"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></svg></span>Family Budget</h1>
    <nav></nav>
  </header>
  <main id="main"></main>
  <footer>
    <span id="save-note"></span>
    <button id="sign-out" hidden>Sign out</button>
  </footer>
  <script>
    // Start the helper that keeps the app up to date (see sw.js). The very
    // first time it takes over, reload once so this visit gets fresh files.
    if ('serviceWorker' in navigator) {
      const firstTime = !navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (firstTime && !sessionStorage.getItem('sw-reloaded')) {
          sessionStorage.setItem('sw-reloaded', '1');
          location.reload();
        }
      });
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
